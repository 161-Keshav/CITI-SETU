services:
  api:
    image: python:3.11-slim
    working_dir: /app
    volumes: [".:/app"]
    command: sh -c "pip install -e . && uvicorn setu.serving.app:app --app-dir src --host 0.0.0.0 --port 8000"
    ports: ["8000:8000"]
  payer-app:
    image: node:20-alpine
    working_dir: /app/apps/payer-app
    volumes: [".:/app"]
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports: ["5173:5173"]
    depends_on: [api]
  ops-dashboard:
    image: node:20-alpine
    working_dir: /app/apps/ops-dashboard
    volumes: [".:/app"]
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports: ["5174:5174"]
    depends_on: [api]

